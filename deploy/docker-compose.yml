# كل النظام بأمر واحد:  docker compose up -d --build
# ولرابط https مؤقت للموبايل:  docker compose --profile tunnel up -d --build
# وعلى السيرفر أضف خادم المكالمات (TURN):  docker compose --profile tunnel --profile turn up -d --build
name: asbat-chat

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wasl
      POSTGRES_USER: wasl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasl"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # الـ API (HTTP): gunicorn بعدة عمليات وthreads
  web:
    build: ../backend
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgres://wasl:${POSTGRES_PASSWORD:-change-me}@db:5432/wasl
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      KEYS_DIR: /app/keys
      NUM_PROXIES: "1"
    volumes: &backend_volumes
      - media:/data/media
      - keys:/app/keys
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  # الاتصالات المباشرة (WebSocket): uvicorn بعدة عمال، وكلهم يتواصلون عبر Redis
  ws:
    build: ../backend
    command: ["ws"]
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    volumes: *backend_volumes
    depends_on: [web]

  frontend:
    build: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, ws, frontend]

  # خادم ترحيل المكالمات (TURN): يمرّر الصوت والصورة حين لا يصل الجهازان إلى بعضهما مباشرة، مثل هاتف على بيانات
  # الجوال وحاسوب على واي فاي (وإلا تبقى المكالمة «جارٍ الاتصال» ثم تفشل). يعمل على شبكة السيرفر مباشرة (host) لأنه
  # يحتاج منافذ UDP كثيرة. افتح بجدار الحماية: 3478 (UDP وTCP) و49160-49200 (UDP).
  # كلمات السر مؤقتة يولّدها الخادم من TURN_SECRET (calls/views.py)، ولا يُرحَّل إلى عناوين الشبكات الداخلية.
  turn:
    image: coturn/coturn:4.6-alpine
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --log-file=stdout --listening-port=3478 --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-} --realm=wasl
      --min-port=49160 --max-port=49200 --no-cli --no-tls --no-dtls --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --total-quota=200 --user-quota=12 --stale-nonce=600

  # رابط https مؤقت (بدون دومين) حتى تجرب من أي موبايل. يطلع بالسجل: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    depends_on: [caddy]

volumes:
  pgdata:
  media:
  keys:
  caddy_data:
